name: Problem
description: Something in the guide, the package, or the dashboard is wrong or fails.
title: "Problem: "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the Troubleshooting page first, and remove private data: IP addresses, host names, serial numbers, names, and locations.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Guide (a page is wrong or unclear)
        - Home Assistant package
        - Dashboard
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: DRS model, DIP switches, CN12 pins 7 and 8
      placeholder: DRS-240-12. 1 ON, 2 OFF, 3 ON. Open
  - type: input
    id: ha
    attributes:
      label: Home Assistant version
      placeholder: Core 2026.9.4
  - type: textarea
    id: values
    attributes:
      label: Values at the moment of the problem
      description: The three status words (fault, charge, system), the battery voltage and current, and the AC input voltage.
  - type: textarea
    id: logs
    attributes:
      label: Log lines or the output of Check configuration
      render: text
